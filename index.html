<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Dá Jogo — junta a galera, organiza a turma e fecha o time." />
    <meta name="theme-color" content="#f4f6f8" />
    <title>Dá Jogo</title>

    <!-- Aplica o tema antes da primeira pintura (script síncrono e pequeno, ver public/theme-init.js) -->
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/splash.css" />

    <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Instalado na tela inicial (iOS) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dá Jogo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <!-- Abertura animada (public/splash.css): as peças do próprio logo (public/brand/splash/) entram uma a uma
         e formam o símbolo. Fica fora do #root para o React não reiniciar a animação; começa quando as
         imagens carregam (public/theme-init.js) e sai no fim (src/app/splash.ts). -->
    <div id="splash" class="splash" role="status" aria-label="Abrindo o Dá Jogo">
      <div class="splash-mark">
        <img class="p p-swoosh" src="/brand/splash/swoosh.png" alt="" width="914" height="656" />
        <img class="p p-bowl" src="/brand/splash/bowl.png" alt="" width="914" height="656" />
        <img class="p p-bar" src="/brand/splash/bar.png" alt="" width="914" height="656" />
        <img class="p p-runner" src="/brand/splash/runner.png" alt="" width="914" height="656" />
        <img class="p p-ball" src="/brand/splash/ball.png" alt="" width="914" height="656" />
        <span class="splash-ring" aria-hidden="true"></span>
      </div>
      <p class="splash-word" aria-hidden="true">Dá <span>Jogo</span></p>
    </div>
    <div id="root"></div>
    <noscript>O Dá Jogo precisa de JavaScript para funcionar.</noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
